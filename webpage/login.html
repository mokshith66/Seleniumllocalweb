
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2, #4facfe);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 20px 60px rgba(24, 20, 70, 0.25);
            text-align: center;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 34px;
        }

        h1 {
            color: #242448;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #77778b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #343450;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dedeee;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: #f9f9ff;
            transition: 0.2s;
        }

        input:focus {
            border-color: #7665df;
            box-shadow: 0 0 0 3px rgba(118, 101, 223, 0.13);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .success {
            color: #16834a;
        }

        .error {
            color: #d93045;
        }

        .footer {
            margin-top: 25px;
            color: #88889a;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="login-card" id="loginBox">
        <div class="logo" aria-hidden="true">&#127891;</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Sign in to your Student Portal</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <button id="loginButton" type="submit">Sign In</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <p class="footer">Student Portal &copy; 2026</p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit", function(event) {
                event.preventDefault();

                const username =
                    document.getElementById("username").value;
                const password =
                    document.getElementById("password").value;
                const message =
                    document.getElementById("message");

                if (username === "student" && password === "12345") {
                    message.textContent = "Login Successful";
                    message.className = "success";
                } else {
                    message.textContent =
                        "Invalid Username or Password";
                    message.className = "error";
                }
            }
        );
    </script>
</body>
</html>
